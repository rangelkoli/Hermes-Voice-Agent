[package]
name = "hermes-voice"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Hermes voice client"

[dependencies]
base64 = "0.22"
cpal = "0.15"
crossterm = "0.28"
libc = "0.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }
ratatui = "0.29"
regex = "1"
serde_json = "1"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
whisper-rs = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true
