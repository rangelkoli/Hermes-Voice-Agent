[project]
name = "hermes-voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rangel Koli", email = "77476841+rangelkoli@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "textual>=8.2.8",
]

[project.scripts]
hermes-voice = "hermes_voice.__main__:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
